name: Update ZCSH data
on:
  schedule:
    - cron: "5,35 21-23 * * 1-5"   # every 30 min, ~5pm-8pm ET, Mon-Fri
    - cron: "5,35 0-4 * * 2-6"     # every 30 min, ~8pm-1am ET (crosses midnight UTC)
  workflow_dispatch: {}       # the manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "zec-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/zcsh.json
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
