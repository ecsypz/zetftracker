name: Update ZCSH data
on:
  schedule:
    - cron: "45 0 * * 2-6"   # ~7:45pm ET Mon-Fri (winter), after daily NAV posts
    - cron: "45 4 * * 2-6"   # late-evening retry in case the file posts late
  workflow_dispatch: {}       # the manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "zec-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/zcsh.json
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
